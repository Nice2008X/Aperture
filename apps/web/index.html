    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Aperture",
        "description": "An interactive explorer and debugger for real large language model internals, backed by a real GPU — architecture graphs, live forward passes, weight/activation inspection, and causal interventions for dense and Mixture-of-Experts models alike.",

        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any (web-based, GPU backend required)"
      }
    </script>

    <script>
      // Applied before React mounts (and before first paint) so switching
      // themes across reloads never flashes the previous/default theme.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("app:theme") || '"dark"');
          if (saved && saved !== "dark") document.documentElement.setAttribute("data-theme", saved);
        } catch (e) {}
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
