<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aperture</title>
    <script>
      // Applied before React mounts (and before first paint) so switching
      // themes across reloads never flashes the previous/default theme.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("app:theme") || '"dark"');
          if (saved && saved !== "dark") document.documentElement.setAttribute("data-theme", saved);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
